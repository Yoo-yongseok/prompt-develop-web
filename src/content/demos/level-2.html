<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 습관 기록</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #e8ffe8;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 {
    color: #22e06b;
    font-size: 24px;
    margin: 0 0 20px;
    letter-spacing: 1px;
  }
  section {
    border: 1px solid #1f6b3a;
    background: #0a0f0b;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  h2 { font-size: 16px; color: #22e06b; margin: 0 0 12px; }
  label { display: block; font-size: 14px; margin-bottom: 6px; color: #b8e8c6; }
  input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #000;
    color: #e8ffe8;
    border: 1px solid #22e06b;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    background: #22e06b;
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:active { background: #1bb556; }
  .msg { font-size: 14px; color: #22e06b; min-height: 18px; margin-top: 8px; }
  .big { font-size: 28px; font-weight: bold; color: #22e06b; }
  .progress {
    height: 14px;
    background: #102a18;
    border-radius: 7px;
    overflow: hidden;
    margin: 10px 0 6px;
  }
  .progress > div { height: 100%; background: #22e06b; width: 0; }
  .row { display: flex; justify-content: space-between; font-size: 14px; }
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 160px;
    border-bottom: 1px solid #1f6b3a;
    padding-top: 10px;
    overflow-x: auto;
  }
  .bar-col {
    flex: 0 0 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar { width: 24px; background: #22e06b; border-radius: 3px 3px 0 0; }
  .bar-val { font-size: 11px; color: #b8e8c6; margin-bottom: 3px; }
  .labels { display: flex; gap: 8px; overflow-x: auto; }
  .labels span { flex: 0 0 36px; text-align: center; font-size: 11px; color: #7fbf94; padding-top: 4px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 8px 0; border-bottom: 1px solid #143d22; font-size: 14px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="wrap">
  <h1>운동 습관 기록</h1>

  <section>
    <h2>하루 운동 목표</h2>
    <label for="goal">목표 시간 (분)</label>
    <input id="goal" type="number" min="1">
    <button id="goalBtn">목표 설정</button>
    <div class="msg" id="goalMsg"></div>
  </section>

  <section>
    <h2>운동 시간 기록</h2>
    <label for="date">날짜</label>
    <input id="date" type="date">
    <label for="minutes">운동 시간 (분)</label>
    <input id="minutes" type="number" min="1">
    <button id="addBtn">기록하기</button>
    <div class="msg" id="addMsg"></div>
  </section>

  <section>
    <h2>오늘의 진행</h2>
    <div class="row"><span>오늘 운동</span><span id="todayText">0분</span></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="row"><span>목표</span><span id="goalText">-</span></div>
  </section>

  <section>
    <h2>포인트</h2>
    <div class="big" id="points">0 P</div>
  </section>

  <section>
    <h2>운동 그래프 (날짜별 분)</h2>
    <div class="chart" id="chart"></div>
    <div class="labels" id="labels"></div>
  </section>

  <section>
    <h2>기록 목록</h2>
    <ul id="list"></ul>
  </section>
</div>

<script>
  const state = { goal: null, records: [], points: 0 };
  const POINTS_PER_WORKOUT = 10;

  function todayStr() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  document.getElementById('date').value = todayStr();

  document.getElementById('goalBtn').addEventListener('click', () => {
    const v = Number(document.getElementById('goal').value);
    if (!v || v <= 0) return;
    state.goal = v;
    document.getElementById('goalMsg').textContent = '하루 목표가 ' + v + '분으로 설정되었습니다.';
    render();
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    const date = document.getElementById('date').value;
    const min = Number(document.getElementById('minutes').value);
    if (!date || !min || min <= 0) return;
    state.records.push({ date, min });
    state.points += POINTS_PER_WORKOUT;
    document.getElementById('addMsg').textContent = min + '분 기록 완료! +' + POINTS_PER_WORKOUT + ' P';
    document.getElementById('minutes').value = '';
    render();
  });

  function render() {
    const totals = {};
    state.records.forEach(r => { totals[r.date] = (totals[r.date] || 0) + r.min; });

    const today = totals[todayStr()] || 0;
    document.getElementById('todayText').textContent = today + '분';
    document.getElementById('goalText').textContent = state.goal ? state.goal + '분' : '-';
    const pct = state.goal ? Math.min(100, today / state.goal * 100) : 0;
    document.getElementById('bar').style.width = pct + '%';

    document.getElementById('points').textContent = state.points + ' P';

    const dates = Object.keys(totals).sort();
    const max = Math.max(1, ...dates.map(d => totals[d]));
    const chart = document.getElementById('chart');
    const labels = document.getElementById('labels');
    chart.innerHTML = '';
    labels.innerHTML = '';
    dates.forEach(d => {
      const col = document.createElement('div');
      col.className = 'bar-col';
      const val = document.createElement('div');
      val.className = 'bar-val';
      val.textContent = totals[d];
      const b = document.createElement('div');
      b.className = 'bar';
      b.style.height = (totals[d] / max * 120) + 'px';
      col.appendChild(val);
      col.appendChild(b);
      chart.appendChild(col);
      const lb = document.createElement('span');
      lb.textContent = d.slice(5).replace('-', '/');
      labels.appendChild(lb);
    });

    const list = document.getElementById('list');
    list.innerHTML = '';
    state.records.slice().reverse().forEach(r => {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><span></span>';
      li.children[0].textContent = r.date;
      li.children[1].textContent = r.min + '분';
      list.appendChild(li);
    });
  }

  render();
</script>
</body>
</html>
