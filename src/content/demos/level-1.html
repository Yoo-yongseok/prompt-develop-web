<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운동 기록</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #fff;
    color: #000;
    font-family: sans-serif;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    min-width: 0;
    font-size: 16px;
  }
  button {
    font-size: 16px;
  }
  ul {
    padding-left: 20px;
  }
  li {
    margin: 6px 0;
    word-break: break-all;
  }
</style>
</head>
<body>
  <h1>운동 기록</h1>
  <form id="form">
    <input id="text" type="text" placeholder="운동 내용">
    <button type="submit">기록</button>
  </form>
  <ul id="list"></ul>

<script>
  const records = [];
  const form = document.getElementById('form');
  const input = document.getElementById('text');
  const list = document.getElementById('list');

  function render() {
    list.innerHTML = '';
    records.forEach(function (r) {
      const li = document.createElement('li');
      li.textContent = r;
      list.appendChild(li);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    records.push(input.value);
    input.value = '';
    render();
  });
</script>
</body>
</html>
