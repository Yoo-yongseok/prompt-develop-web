<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운동 기록</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 24px 18px 40px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
  input {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 14px;
    font-family: inherit;
    color: #222;
  }
  input:focus { outline: none; border-color: #2c3e66; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #2c3e66;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  h2 { font-size: 17px; margin: 32px 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 14px 0; border-bottom: 1px solid #eee; }
  .date { font-size: 13px; color: #777; }
  .empty { color: #888; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>운동 기록</h1>
  <form id="form">
    <label for="date">날짜</label>
    <input type="date" id="date">
    <label for="content">운동 내용</label>
    <input type="text" id="content" placeholder="예: 달리기 30분">
    <button type="submit">기록하기</button>
  </form>

  <h2>기록 목록</h2>
  <ul id="list"></ul>
  <p class="empty" id="empty">아직 기록이 없습니다.</p>
</div>

<script>
  const records = [];
  const dateEl = document.getElementById('date');
  const contentEl = document.getElementById('content');
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');

  const t = new Date();
  dateEl.value = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');

  function render() {
    listEl.innerHTML = '';
    emptyEl.style.display = records.length ? 'none' : 'block';
    records.forEach(r => {
      const li = document.createElement('li');
      const d = document.createElement('div');
      d.className = 'date';
      d.textContent = r.date;
      const c = document.createElement('div');
      c.textContent = r.content;
      li.appendChild(d);
      li.appendChild(c);
      listEl.appendChild(li);
    });
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const content = contentEl.value.trim();
    if (!content) return;
    records.unshift({ date: dateEl.value, content });
    contentEl.value = '';
    render();
  });

  render();
</script>
</body>
</html>
