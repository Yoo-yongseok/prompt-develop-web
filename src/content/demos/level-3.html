<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 기록</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#eee;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px;max-width:480px;margin:0 auto}
h1{color:#39ff14;font-size:22px;font-weight:900;letter-spacing:1px;margin-bottom:16px;font-style:italic}
h2{color:#39ff14;font-size:15px;font-weight:800;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
section{background:#0d0d0d;border:1px solid #1f1f1f;border-left:3px solid #39ff14;border-radius:10px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{text-align:center}
.stat .v{font-size:22px;font-weight:900;color:#39ff14}
.stat .l{font-size:11px;color:#999;margin-top:2px}
.bar{height:12px;background:#1a1a1a;border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:#39ff14;box-shadow:0 0 8px #39ff14;transition:width .3s}
.sub{font-size:12px;color:#aaa;margin-top:6px}
label{display:block;font-size:12px;color:#aaa;margin:8px 0 4px}
input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;font-size:15px}
input:focus,select:focus{outline:none;border-color:#39ff14}
button{background:#39ff14;color:#000;border:none;padding:10px 14px;border-radius:6px;font-weight:800;font-size:14px;cursor:pointer}
button.ghost{background:transparent;color:#39ff14;border:1px solid #39ff14}
button.danger{background:transparent;color:#ff4d4d;border:1px solid #ff4d4d}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1}
.msg{font-size:12px;color:#ff4d4d;margin-top:8px;min-height:14px}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.col .b{width:100%;background:#39ff14;border-radius:4px 4px 0 0;min-height:2px}
.col .n{font-size:10px;color:#39ff14;margin-bottom:3px}
.col .d{font-size:10px;color:#888;margin-top:4px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1f1f1f;gap:8px}
.item:last-child{border-bottom:none}
.item .t{font-weight:700}
.item .s{font-size:12px;color:#888}
.item button{padding:6px 10px;font-size:12px}
.pts{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
</style>
</head>
<body>
<h1>⚡ 운동 습관 챌린지</h1>

<section>
<h2>오늘</h2>
<div class="stats">
<div class="stat"><div class="v" id="todayMin">0</div><div class="l">오늘 운동(분)</div></div>
<div class="stat"><div class="v" id="rate">0%</div><div class="l">목표 달성률</div></div>
<div class="stat"><div class="v" id="level">1</div><div class="l">현재 레벨</div></div>
</div>
<div class="bar"><div id="goalBar" style="width:0%"></div></div>
<div class="sub" id="goalText"></div>
<div class="sub">총 운동 시간: <b id="totalMin" style="color:#39ff14">0</b>분</div>
</section>

<section>
<h2>목표 설정</h2>
<label>하루 운동 목표 시간(분)</label>
<input type="number" id="goalInput" min="1" step="1" value="30">
<div class="row"><button id="goalBtn">목표 저장</button></div>
<div class="msg" id="goalMsg"></div>
</section>

<section>
<h2>보상</h2>
<div class="pts"><span>누적 포인트: <b id="points" style="color:#39ff14">0</b>P</span><span>레벨 <b id="level2">1</b></span></div>
<div class="bar"><div id="lvBar" style="width:0%"></div></div>
<div class="sub" id="lvText"></div>
</section>

<section>
<h2 id="formTitle">운동 기록하기</h2>
<label>운동 종류</label>
<input type="text" id="type" placeholder="예: 달리기">
<label>날짜</label>
<input type="date" id="date">
<label>운동 시간(분)</label>
<input type="number" id="min" min="1" step="1" placeholder="예: 30">
<div class="row">
<button id="saveBtn">기록 추가</button>
<button class="ghost" id="cancelBtn" style="display:none">취소</button>
</div>
<div class="msg" id="formMsg"></div>
</section>

<section>
<h2>최근 7일</h2>
<div class="chart" id="chart"></div>
</section>

<section>
<h2>운동 기록</h2>
<div id="list"></div>
</section>

<script>
let records=[],goal=30,editId=null,nextId=1;
const $=id=>document.getElementById(id);
const fmt=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const today=()=>fmt(new Date());
$('date').value=today();

function render(){
  const t=today();
  const todayMin=records.filter(r=>r.date===t).reduce((a,r)=>a+r.min,0);
  const total=records.reduce((a,r)=>a+r.min,0);
  const rate=Math.round(todayMin/goal*100);
  $('todayMin').textContent=todayMin;
  $('rate').textContent=rate+'%';
  $('goalBar').style.width=Math.min(rate,100)+'%';
  $('goalText').textContent=`${todayMin}분 / 목표 ${goal}분`;
  $('totalMin').textContent=total;
  const pts=Math.floor(total/10)*10;
  const lv=Math.floor(pts/100)+1;
  $('points').textContent=pts;
  $('level').textContent=lv;$('level2').textContent=lv;
  $('lvBar').style.width=(pts%100)+'%';
  $('lvText').textContent=`다음 레벨까지 ${100-pts%100}P`;
  // chart
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const vals=days.map(d=>records.filter(r=>r.date===fmt(d)).reduce((a,r)=>a+r.min,0));
  const max=Math.max(...vals,1);
  $('chart').innerHTML=days.map((d,i)=>`<div class="col"><div class="n">${vals[i]}</div><div class="b" style="height:${vals[i]/max*100}px"></div><div class="d">${d.getMonth()+1}/${d.getDate()}</div></div>`).join('');
  // list
  const sorted=[...records].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('list').innerHTML=sorted.map(r=>`<div class="item"><div><div class="t">${esc(r.type)}</div><div class="s">${r.date} · ${r.min}분</div></div><div style="display:flex;gap:6px"><button class="ghost" onclick="edit(${r.id})">수정</button><button class="danger" onclick="del(${r.id})">삭제</button></div></div>`).join('');
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('goalBtn').onclick=()=>{
  const v=$('goalInput').value.trim();
  if(!/^\d+$/.test(v)||+v<=0){$('goalMsg').textContent='1분 이상의 정수로 입력해 주세요.';return}
  goal=+v;$('goalMsg').textContent='';render();
};

$('saveBtn').onclick=()=>{
  const type=$('type').value.trim(),date=$('date').value,mv=$('min').value.trim();
  if(!type){$('formMsg').textContent='운동 종류를 입력해 주세요.';return}
  if(!date){$('formMsg').textContent='날짜를 선택해 주세요.';return}
  if(!/^\d+$/.test(mv)||+mv<=0||+mv>1440){$('formMsg').textContent='운동 시간은 1~1440분 사이의 정수로 입력해 주세요.';return}
  if(editId!==null){Object.assign(records.find(r=>r.id===editId),{type,date,min:+mv})}
  else records.push({id:nextId++,type,date,min:+mv});
  resetForm();render();
};
function resetForm(){
  editId=null;$('type').value='';$('min').value='';$('date').value=today();
  $('formMsg').textContent='';$('saveBtn').textContent='기록 추가';
  $('formTitle').textContent='운동 기록하기';$('cancelBtn').style.display='none';
}
$('cancelBtn').onclick=resetForm;
function edit(id){
  const r=records.find(x=>x.id===id);editId=id;
  $('type').value=r.type;$('date').value=r.date;$('min').value=r.min;
  $('saveBtn').textContent='수정 저장';$('formTitle').textContent='기록 수정';
  $('cancelBtn').style.display='block';$('formMsg').textContent='';
  $('type').scrollIntoView({block:'center'});
}
function del(id){
  records=records.filter(r=>r.id!==id);
  if(editId===id)resetForm();
  render();
}
render();
</script>
</body>
</html>
